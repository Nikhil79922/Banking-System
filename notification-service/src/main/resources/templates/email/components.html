<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Hero banner: round status icon, label, headline, optional subtitle -->
<table th:fragment="hero(icon, accent, tint, label, title, subtitle)"
       role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       th:style="'background-color:' + ${tint} + ';'">
    <tr>
        <td align="center" class="px" style="padding:36px 36px 30px 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td align="center" valign="middle" width="68" height="68"
                        th:style="'width:68px;height:68px;border-radius:34px;background-color:' + ${accent} + ';color:#ffffff;font-size:30px;line-height:68px;font-weight:bold;'"
                        th:text="${icon}">&#10003;</td>
                </tr>
            </table>
            <div th:text="${label}"
                 th:style="'margin-top:18px;font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:' + ${accent} + ';'">STATUS</div>
            <h1 th:text="${title}"
                style="margin:8px 0 0 0;font-size:26px;line-height:32px;font-weight:700;color:#0a2540;">Headline</h1>
            <p th:if="${subtitle != null and subtitle != ''}" th:text="${subtitle}"
               style="margin:10px 0 0 0;font-size:14px;line-height:22px;color:#4a5560;">Subtitle</p>
        </td>
    </tr>
</table>

<!-- Greeting + intro paragraph -->
<table th:fragment="intro(text)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td class="px" style="padding:28px 36px 4px 36px;">
            <p style="margin:0 0 8px 0;font-size:15px;font-weight:600;color:#0a2540;">Dear Customer,</p>
            <p th:text="${text}" style="margin:0;font-size:14px;line-height:23px;color:#3d4954;">Intro text</p>
        </td>
    </tr>
</table>

<!-- Big amount card -->
<table th:fragment="amount(label, value, accent)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td class="px" style="padding:20px 36px 0 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#ffffff;border:1px solid #dfe5ee;border-radius:12px;">
                <tr>
                    <td align="center" style="padding:20px 16px;">
                        <div th:text="${label}"
                             style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#7a8794;">Amount</div>
                        <div th:text="${value}"
                             th:style="'margin-top:6px;font-size:36px;line-height:42px;font-weight:700;color:' + ${accent} + ';'">0.00</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<!-- One label/value row inside a card; skipped when value is null -->
<tr th:fragment="row(label, value, mono, last)" th:if="${value != null}">
    <td th:style="'padding:13px 0;font-size:13px;color:#6b7785;' + (${last} ? '' : 'border-bottom:1px solid #e3e8ef;')" th:text="${label}">Label</td>
    <td align="right"
        th:style="'padding:13px 0;font-size:14px;font-weight:600;color:#0a2540;' + (${last} ? '' : 'border-bottom:1px solid #e3e8ef;') + (${mono} ? 'font-family:Consolas,Monaco,monospace;' : '')"
        th:text="${value}">Value</td>
</tr>

<!-- Highlighted notice box -->
<table th:fragment="notice(tint, accent, title, text)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td class="px" style="padding:20px 36px 0 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td th:style="'background-color:' + ${tint} + ';border-left:4px solid ' + ${accent} + ';border-radius:6px;padding:14px 18px;'">
                        <div th:text="${title}" style="font-size:13px;font-weight:700;color:#0a2540;margin-bottom:4px;">Title</div>
                        <div th:text="${text}" style="font-size:13px;line-height:20px;color:#3d4954;">Text</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<!-- Centered call-to-action button -->
<table th:fragment="button(href, label, bg)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" class="px" style="padding:26px 36px 0 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td align="center" th:style="'border-radius:8px;background-color:' + ${bg} + ';'">
                        <a th:href="${href}" th:text="${label}"
                           style="display:inline-block;padding:14px 32px;font-size:14px;font-weight:700;letter-spacing:0.3px;color:#ffffff;text-decoration:none;border-radius:8px;">Button</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<!-- Bottom spacing before the support strip -->
<div th:fragment="spacer" style="height:28px;line-height:28px;font-size:0;">&nbsp;</div>

</body>
</html>
