<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout(~{::title}, ~{::section})}">
<head><title>Suspicious Activity Detected</title></head>
<body>
<section>
    <div th:replace="~{email/components :: hero('&#9888;', '#b3261e', '#fdecea', 'Security alert', 'Suspicious activity detected', ${'Account ' + accountNumber})}"></div>

    <div th:replace="~{email/components :: intro('Our fraud monitoring system flagged a transaction on your account. Please review the details below and act if it was not you.')}"></div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td class="px" style="padding:20px 36px 0 36px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="background-color:#f6f8fb;border-radius:12px;">
                    <tr>
                        <td style="padding:6px 20px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr th:replace="~{email/components :: row('Account', ${accountNumber}, true, false)}"></tr>
                                <tr th:replace="~{email/components :: row('Transaction ID', ${transactionId}, true, false)}"></tr>
                                <tr th:replace="~{email/components :: row('Reason flagged', ${reason}, false, false)}"></tr>
                                <tr th:replace="~{email/components :: row('Date &amp; time', ${sentAt}, false, true)}"></tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- What to do now -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td class="px" style="padding:24px 36px 0 36px;">
                <div style="font-size:14px;font-weight:700;color:#0a2540;margin-bottom:10px;">What to do now</div>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td width="30" valign="top" style="padding:5px 0;">
                            <div style="width:22px;height:22px;line-height:22px;border-radius:11px;background-color:#b3261e;color:#ffffff;font-size:12px;font-weight:700;text-align:center;">1</div>
                        </td>
                        <td style="padding:5px 0;font-size:13px;line-height:21px;color:#3d4954;">Do not share your OTP, PIN or password with anyone.</td>
                    </tr>
                    <tr>
                        <td width="30" valign="top" style="padding:5px 0;">
                            <div style="width:22px;height:22px;line-height:22px;border-radius:11px;background-color:#b3261e;color:#ffffff;font-size:12px;font-weight:700;text-align:center;">2</div>
                        </td>
                        <td style="padding:5px 0;font-size:13px;line-height:21px;color:#3d4954;">If this was not you, contact your bank immediately.</td>
                    </tr>
                    <tr>
                        <td width="30" valign="top" style="padding:5px 0;">
                            <div style="width:22px;height:22px;line-height:22px;border-radius:11px;background-color:#b3261e;color:#ffffff;font-size:12px;font-weight:700;text-align:center;">3</div>
                        </td>
                        <td style="padding:5px 0;font-size:13px;line-height:21px;color:#3d4954;">Keep the transaction ID above handy when you call.</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <div th:replace="~{email/components :: button('tel:' + ${supportPhone}, 'Call us now', '#b3261e')}"></div>

    <div th:replace="~{email/components :: spacer}"></div>
</section>
</body>
</html>
