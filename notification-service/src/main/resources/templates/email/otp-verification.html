<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout(~{::title}, ~{::section})}">
<head><title>Transaction Verification Required</title></head>
<body>
<section>
    <div th:replace="~{email/components :: hero('&#128274;', '#e08600', '#fff6e8', 'Verification required', 'Verify this transaction', ${'Account ' + accountNumber})}"></div>

    <div th:replace="~{email/components :: intro('We noticed unusual activity on your account, so the transaction below is on hold. Use the one-time password to confirm it is you.')}"></div>

    <div th:replace="~{email/components :: amount('Transaction amount', ${amount}, '#0a2540')}"></div>

    <!-- OTP digit boxes -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center" class="px" style="padding:26px 36px 0 36px;">
                <div style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#7a8794;margin-bottom:10px;">Your one-time password</div>
                <table role="presentation" cellpadding="0" cellspacing="6" border="0" align="center">
                    <tr>
                        <td th:each="i : ${#numbers.sequence(0, #strings.length(otp) - 1)}"
                            align="center" valign="middle" width="44" height="56"
                            style="width:44px;height:56px;background-color:#f1f5fb;border:1px solid #c5d3e5;border-radius:8px;font-size:28px;font-weight:700;color:#0a2540;font-family:Consolas,Monaco,monospace;"
                            th:text="${#strings.substring(otp, i, i + 1)}">1</td>
                    </tr>
                </table>
                <div style="margin-top:12px;font-size:12px;font-weight:600;color:#c0392b;">
                    &#9201; Expires in <span th:text="${expiryMinutes} ?: 5">5</span> minutes
                </div>
            </td>
        </tr>
    </table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td class="px" style="padding:20px 36px 0 36px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="background-color:#f6f8fb;border-radius:12px;">
                    <tr>
                        <td style="padding:6px 20px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr th:replace="~{email/components :: row('Reason flagged', ${reason}, false, false)}"></tr>
                                <tr th:replace="~{email/components :: row('Date &amp; time', ${sentAt}, false, true)}"></tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <div th:replace="~{email/components :: notice('#fff6e8', '#e08600', 'Never share this OTP', 'Bank staff will never ask for it. If this was not you, do not use the code and contact us right away.')}"></div>

    <div th:replace="~{email/components :: button('tel:' + ${supportPhone}, 'Not me? Call us now', '#b3261e')}"></div>

    <div th:replace="~{email/components :: spacer}"></div>
</section>
</body>
</html>
